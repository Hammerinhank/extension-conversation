<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px system-ui, sans-serif; width: 360px; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .status { padding: 6px 8px; border-radius: 6px; margin-bottom: 8px; }
    .ok { background: #e6f4ea; color: #137333; }
    .ko { background: #fce8e6; color: #c5221f; }
    select { width: 100%; box-sizing: border-box; margin: 4px 0 8px; font: inherit; }
    button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #1a73e8;
             background: #1a73e8; color: #fff; cursor: pointer; }
    button.secondary { background: #fff; color: #1a73e8; }
    button:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 6px; margin-bottom: 6px; }
    .row button { flex: 1; }
    progress { width: 100%; height: 14px; }
    .small { font-size: 12px; color: #5f6368; margin-top: 4px; min-height: 16px; }
    .warn { color: #b06000; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Groupes réductibles</h1>
  <div id="status" class="status">Analyse…</div>

  <div id="controls" hidden>
    <label for="groupSelect" class="small">Choisissez un groupe :</label>
    <select id="groupSelect" size="8"></select>

    <div class="row">
      <button id="btnOne">Exporter ce groupe (JSON)</button>
    </div>
    <div class="row">
      <button id="btnAll">Exporter tous les groupes (JSON)</button>
      <button id="btnCancel" class="secondary" hidden>Annuler</button>
    </div>

    <progress id="progress" value="0" max="1" hidden></progress>
    <div id="progressText" class="small"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
